name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test and compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check src bootstrap_model.py train_model.py generate_submission.py tests

      - name: Run tests with coverage
        run: pytest -q --cov=src --cov-report=term-missing --cov-report=xml

      - name: Validate Python compilation
        run: python -m compileall -q src bootstrap_model.py train_model.py generate_submission.py
