name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint
        run: ruff check src api.py bootstrap_model.py train_model.py tests

      - name: Run tests with coverage
        run: |
          pytest -q --cov=src --cov=api --cov-report=term-missing --cov-report=xml

      - name: Validate Python compilation
        run: python -m compileall -q src api.py bootstrap_model.py train_model.py
